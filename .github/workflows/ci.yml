name: Backend CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/three-tier-app/values.yaml'

concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'Update backend image to')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest

      - name: Build Docker image
        run: docker build -t three-tier-backend:ci ./backend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: three-tier-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        run: docker tag three-tier-backend:ci ${{ secrets.DOCKER_USERNAME }}/three-tier-backend:${{ github.sha }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/three-tier-backend:${{ github.sha }}
      - name: Update Helm image tag
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" helm/three-tier-app/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/three-tier-app/values.yaml
          git commit -m "Update backend image to ${{ github.sha }}"
          git push
