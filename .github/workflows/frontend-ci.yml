name: Frontend CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js
          echo "Frontend files are present"
      - name: Build Docker image
        run: docker build -t three-tier-frontend:ci ./frontend
