name: Frontend CI

on:
  push:
    branches:
      - main
concurrency:
  group: main-ci
  cancel-in-progress: false

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'Update frontend image to') && !contains(github.event.head_commit.message, 'Update backend image to')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/script.js
          echo "Frontend files are present"
      - name: Build Docker image
        run: docker build -t three-tier-frontend:ci ./frontend
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: three-tier-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Tag Docker image
        run: docker tag three-tier-frontend:ci ${{ secrets.DOCKER_USERNAME }}/three-tier-frontend:${{ github.sha }}
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/three-tier-frontend:${{ github.sha }}

